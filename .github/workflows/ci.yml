# CI zanziGo — backend (tests + migrations) et mobile (typecheck)
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zanzigo
          POSTGRES_PASSWORD: zanzigo
          POSTGRES_DB: zanzigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://zanzigo:zanzigo@localhost:5432/zanzigo_test

      - name: Lancer les tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://zanzigo:zanzigo@localhost:5432/zanzigo_test

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ne rien faire si le dossier mobile/ n'est pas encore présent dans le dépôt
      - name: Vérifier la présence de mobile/
        id: mobile-present
        working-directory: .
        run: |
          if [ -f mobile/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "mobile/package-lock.json absent — job ignoré."
          fi

      - name: Installer Node 22
        if: steps.mobile-present.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        if: steps.mobile-present.outputs.present == 'true'
        run: npm ci

      - name: Vérification TypeScript
        if: steps.mobile-present.outputs.present == 'true'
        run: npx tsc --noEmit
